  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

eroFadeUp .6s ease .05s both;\">Player Profile · Not For Public Transfer<\u002Fspan>\n\n    <image-slot id=\"crest\" style=\"width:128px; height:128px; position:relative; z-index:2; animation:heroFadeUp .6s ease .1s both;\" shape=\"circle\" placeholder=\"club crest\" src=\"ff24033b-fde8-4f7c-9d20-a7a18082368a\"><\u002Fimage-slot>\n\n    <h1 class=\"hero-name display\" style=\"animation:heroFadeUp .6s ease .18s both;\">HIRAL KATARIYA<\u002Fh1>\n    <p class=\"hero-sub mono\" style=\"animation:heroFadeUp .6s ease .26s both;\">Position: <b>Extrovert Forward<\u002Fb> &nbsp;·&nbsp; Club: <b>Surat City<\u002Fb> &nbsp;·&nbsp; DOB: <b>29 Oct 2002<\u002Fb><\u002Fp>\n\n    <sc-if value=\"{{showCountdown}}\" hint-placeholder-val=\"{{true}}\">\n      <div style=\"animation:heroFadeUp .6s ease .34s both;\">\n        <p class=\"clock-caption mono\">Kick-off (birthday) in<\u002Fp>\n        <div class=\"clock\">\n          <div class=\"clock-unit\"><span class=\"clock-num mono\">{{days}}<\u002Fspan><span class=\"clock-label\">days<\u002Fspan><\u002Fdiv>\n          <div class=\"clock-unit\"><span class=\"clock-num mono\">{{hours}}<\u002Fspan><span class=\"clock-label\">hrs<\u002Fspan><\u002Fdiv>\n          <div class=\"clock-unit\"><span class=\"clock-num mono\">{{minutes}}<\u002Fspan><span class=\"clock-label\">min<\u002Fspan><\u002Fdiv>\n          <div class=\"clock-unit\"><span class=\"clock-num mono\" style=\"display:inline-block; animation:pulseSec 1s ease-in-out infinite;\">{{seconds}}<\u002Fspan><span class=\"clock-label\">sec<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n        <p class=\"hero-sub mono\" style=\"margin-top:14px;\">{{ageText}}<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n    <sc-if value=\"{{isBirthday}}\" hint-placeholder-val=\"{{false}}\">\n      <p class=\"bday-banner display\">🎉 IT'S YOUR DAY — HAPPY BIRTHDAY 🎉<\u002Fp>\n    <\u002Fsc-if>\n  <\u002Fdiv>\n<\u002Fheader>\n\n<main class=\"wrap\">\n  <section id=\"journal\" class=\"card\">\n    <div class=\"card-head\">\n      <div>\n        <span class=\"card-kicker mono\"><span class=\"icon-badge icon-blue\">✦<\u002Fspan>Daily Check-In<\u002Fspan>\n        <h2 class=\"card-title display\">A Few Honest Lines<\u002Fh2>\n      <\u002Fdiv>\n      <div class=\"rating rating--blue\"><span class=\"rating-num display\">{{mishtuPoints}}<\u002Fspan><span class=\"rating-tag\">mishtu pts<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n    <p>One quick question. Answer honestly — it earns a Mishtu Point either way; 300 of them unlock a gift pass from Mishtu.<\u002Fp>\n\n    <div class=\"journal-progress\"><div class=\"journal-progress-bar\" style=\"width:{{progressPct}}%;\"><\u002Fdiv><\u002Fdiv>\n    <p class=\"journal-progress-label mono\">{{mishtuPoints}} / 300 Mishtu Points{{giftNote}}<\u002Fp>\n\n    <div class=\"journal-field\">\n      <label class=\"journal-label mono\">How was your mood today?<\u002Flabel>\n      <div class=\"mood-row\">\n        <sc-for list=\"{{moodOptions}}\" as=\"m\" hint-placeholder-count=\"5\">\n          <button class=\"mood-btn {{m.cls}}\" sc-camel-on-click=\"{{m.onClick}}\">{{m.n}}<\u002Fbutton>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <sc-if value=\"{{hasPendingMood}}\" hint-placeholder-val=\"{{false}}\">\n        <button class=\"btn\" sc-camel-on-click=\"{{onConfirmMood}}\">Confirm →<\u002Fbutton>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n\n    <sc-if value=\"{{moodMessage}}\" hint-placeholder-val=\"{{false}}\">\n      <div class=\"mood-response {{moodAnimClass}}\" key=\"{{moodResponseKey}}\">\n        <sc-if value=\"{{showConfetti}}\" hint-placeholder-val=\"{{false}}\">\n          <div class=\"confetti-burst\">\n            <sc-for list=\"{{confettiDots}}\" as=\"dot\" hint-placeholder-count=\"10\">\n              <span class=\"confetti-dot\" style=\"left:{{dot.left}}%; background:{{dot.color}}; animation-delay:{{dot.delay}}s;\"><\u002Fspan>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n        <p class=\"mood-response-text {{moodTextClass}}\">{{moodMessage}}<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{hasJournalHistory}}\" hint-placeholder-val=\"{{false}}\">\n      <div class=\"journal-history-head\">\n        <p style=\"margin:26px 0 4px; font-weight:700;\">Past check-ins<\u002Fp>\n        <button class=\"btn copy-btn journal-refresh-btn\" sc-camel-on-click=\"{{onRefreshLog}}\">Refresh log →<\u002Fbutton>\n      <\u002Fdiv>\n      <div class=\"session-list\">\n        <sc-for list=\"{{journalHistory}}\" as=\"entry\" hint-placeholder-count=\"3\">\n          <div class=\"session-item\">\n            <span class=\"session-item-date mono\">{{entry.date}}<\u002Fspan>\n            <span class=\"session-item-split\">mood {{entry.mood}}/5<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n  <\u002Fsection>\n\n  <p class=\"intro-line\">No coaches, no committees, no one else on the team sheet — this locker only opens for you. Everything in here is yours to poke at, whenever you feel like it.<\u002Fp>\n\n  <section id=\"football\" class=\"card\">\n    <div class=\"card-head\">\n      <div>\n        <span class=\"card-kicker mono\"><span class=\"icon-badge icon-blue\">●<\u002Fspan>Home Ground<\u002Fspan>\n        <h2 class=\"card-title display\">Blaugrana or Nothing<\u002Fh2>\n      <\u002Fdiv>\n      <div class=\"rating rating--blue\"><span class=\"rating-num display\">92<\u002Fspan><span class=\"rating-tag\">devotion<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n    <p>You've loved Barça since before you knew what a false nine was, and that hasn't budged even with Messi three years deep into his Inter Miami era, chasing one more World Cup with Argentina in 2026. Boyhood-club loyalty doesn't come with an expiry date — it's practically a Surat-to-Camp-Nou pilgrimage you make from your phone screen.<\u002Fp>\n    <div class=\"tip\"><b>Fit check:<\u002Fb> jersey tucked loose over jeans, sleeves untouched, kicks doing the talking underneath. Don't overthink it — the shirt is the whole outfit.<\u002Fdiv>\n    <div class=\"tip\"><b>Budget note:<\u002Fb> skip the ₹6,000+ officially licensed kit — a \"fan version\" jersey (₹300–₹1,200, correct badge and colours, just not club-licensed) looks identical from three feet away. Nobody at a five-a-side is checking the hologram tag.<\u002Fdiv>\n    <p style=\"margin-bottom:6px;\">Where to actually buy, budget-first:<\u002Fp>\n    <ul class=\"linklist\">\n      <li><a href=\"https://www.meesho.com/barcelona-2024-home-football-jersey/p/79iut9\" target=\"_blank\" rel=\"noopener\">Meesho — Barcelona/Messi jerseys from ~₹300 <span class=\"arrow\">→<\u002Fspan><\u002Fa><\u002Fli>\n      <li><a href=\"https://topfootball.in/product-category/football-jerseys-in-india/barcelona-football-jersey/\" target=\"_blank\" rel=\"noopener\">TopFootball.in — \"fan version\" tier, ₹699–999, better stitching <span class=\"arrow\">→<\u002Fspan><\u002Fa><\u002Fli>\n      <li><a href=\"https://www.decathlon.in/shop/kipsta-football\" target=\"_blank\" rel=\"noopener\">Decathlon Kipsta — genuinely good, genuinely cheap boots <span class=\"arrow\">→<\u002Fspan><\u002Fa><\u002Fli>\n      <li><a href=\"https://www.olx.in/sports-equipment_c100/q-nikes\" target=\"_blank\" rel=\"noopener\">OLX — secondhand real Nikes, for when only the swoosh will do <span class=\"arrow\">→<\u002Fspan><\u002Fa><\u002Fli>\n    <\u002Ful>\n    <p style=\"margin-bottom:6px;\">And since scores go stale the moment they're written down, here's where the real updates live:<\u002Fp>\n    <ul class=\"linklist\">\n      <li><a href=\"https://www.barcablaugranes.com/barcelona-news\" target=\"_blank\" rel=\"noopener\">Barça Blaugranes — daily Barcelona news <span class=\"arrow\">→<\u002Fspan><\u002Fa><\u002Fli>\n      <li><a href=\"https://www.espn.com/soccer/story/_/id/47978642/lionel-messi-2026-tracker-inter-miami-argentina-games-goals-assists-stats\" target=\"_blank\" rel=\"noopener\">ESPN — Messi's 2026 tracker <span class=\"arrow\">→<\u002Fspan><\u002Fa><\u002Fli>\n    <\u002Ful>\n  <\u002Fsection>\n\n  <section id=\"suggestions\" class=\"card\">\n    <div class=\"card-head\">\n      <div>\n        <span class=\"card-kicker mono\"><span class=\"icon-badge icon-garnet\">■<\u002Fspan>For The Grind<\u002Fspan>\n        <h2 class=\"card-title display\">Gear, Stacks &amp; Watch List<\u002Fh2>\n      <\u002Fdiv>\n      <div class=\"rating rating--garnet\"><span class=\"rating-num display\">95<\u002Fspan><span class=\"rating-tag\">picks<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n    <p>A rotating shortlist — supplements worth knowing about, gear that actually gets used, and a few videos worth watching before your next session.<\u002Fp>\n    <div class=\"anime-grid\">\n      <sc-for list=\"{{suggestionPicks}}\" as=\"item\" hint-placeholder-count=\"6\">\n        <div class=\"anime-card\">\n          <span class=\"anime-tag mono\">{{item.tag}}<\u002Fspan>\n          <div class=\"anime-title\">{{item.title}}<\u002Fdiv>\n          <p class=\"anime-hook\">{{item.hook}}<\u002Fp>\n          <a href=\"{{item.link}}\" target=\"_blank\" rel=\"noopener\">Learn more →<\u002Fa>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n    <button class=\"btn\" sc-camel-on-click=\"{{onShuffleSuggestions}}\">Refresh suggestions →<\u002Fbutton>\n  <\u002Fsection>\n\n  <section id=\"gaming\" class=\"card\">\n    <div class=\"card-head\">\n      <div>\n        <span class=\"card-kicker mono\"><span class=\"icon-badge icon-blue\">◆<\u002Fspan>Home Turf<\u002Fspan>\n        <h2 class=\"card-title display\">Still Queuing<\u002Fh2>\n      <\u002Fdiv>\n      <div class=\"rating rating--blue\"><span class=\"rating-num display\">90<\u002Fspan><span class=\"rating-tag\">reflexes<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n    <p>Call of Duty Mobile is still your lobby of choice, long after most people moved on. There's something to be said for knowing exactly which map, which loadout, which corner to hold. If you ever want to rotate the queue, here's what's worth watching before you try it:<\u002Fp>\n    <div class=\"anime-grid\">\n      <sc-for list=\"{{gamePicks}}\" as=\"item\" hint-placeholder-count=\"6\">\n        <div class=\"anime-card\">\n          <span class=\"anime-tag mono\">{{item.tag}}<\u002Fspan>\n          <div class=\"anime-title\">{{item.title}}<\u002Fdiv>\n          <p class=\"anime-hook\">{{item.hook}}<\u002Fp>\n          <a href=\"{{item.link}}\" target=\"_blank\" rel=\"noopener\">Watch on YouTube →<\u002Fa>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n    <button class=\"btn\" sc-camel-on-click=\"{{onShuffleGames}}\">Refresh suggestions →<\u002Fbutton>\n  <\u002Fsection>\n\n  <section id=\"philosophy\" class=\"card\">\n    <div class=\"card-head\">\n      <div>\n        <span class=\"card-kicker mono\"><span class=\"icon-badge icon-garnet\">○<\u002Fspan>2 AM Arguments<\u002Fspan>\n        <h2 class=\"card-title display\">The Debate Never Really Ends<\u002Fh2>\n      <\u002Fdiv>\n      <div class=\"rating rating--garnet\"><span class=\"rating-num display\">88<\u002Fspan><span class=\"rating-tag\">overthinking<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n    <p>You'd rather chew on a hard question for an hour than get a quick answer to an easy one. So here's a drawer of questions built out of your own obsessions — pull one whenever you want a reason to argue with someone.<\u002Fp>\n    <div class=\"generator\">\n      <div class=\"generator-out\" key=\"{{philoKey}}\">{{philoLine}}<\u002Fdiv>\n      <button class=\"btn\" sc-camel-on-click=\"{{onNextPhilo}}\">Pull another question →<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"anime\" class=\"card\">\n    <div class=\"card-head\">\n      <div>\n        <span class=\"card-kicker mono\"><span class=\"icon-badge icon-blue\">▲<\u002Fspan>Watchlist<\u002Fspan>\n        <h2 class=\"card-title display\">Next In Queue<\u002Fh2>\n      <\u002Fdiv>\n      <div class=\"rating rating--blue\"><span class=\"rating-num display\">85<\u002Fspan><span class=\"rating-tag\">taste<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n    <p>A shortlist picked for someone who likes their stories twisty and their strikers ruthless. Run through the whole pool — hit shuffle for the next six.<\u002Fp>\n    <div class=\"anime-grid\">\n      <sc-for list=\"{{animePicks}}\" as=\"item\" hint-placeholder-count=\"6\">\n        <div class=\"anime-card\">\n          <span class=\"anime-tag mono\">{{item.tag}}<\u002Fspan>\n          <div class=\"anime-title\">{{item.title}}<\u002Fdiv>\n          <p class=\"anime-hook\">{{item.hook}}<\u002Fp>\n          <a href=\"{{item.link}}\" target=\"_blank\" rel=\"noopener\">Find it →<\u002Fa>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n    <button class=\"btn\" sc-camel-on-click=\"{{onShuffleAnime}}\">Shuffle picks →<\u002Fbutton>\n  <\u002Fsection>\n\n  <section id=\"screens\" class=\"card\">\n    <div class=\"card-head\">\n      <div>\n        <span class=\"card-kicker mono\"><span class=\"icon-badge icon-garnet\">◇<\u002Fspan>Beyond Anime<\u002Fspan>\n        <h2 class=\"card-title display\">K-Drama &amp; Crime Thriller Watchlist<\u002Fh2>\n      <\u002Fdiv>\n      <div class=\"rating rating--garnet\"><span class=\"rating-num display\">91<\u002Fspan><span class=\"rating-tag\">plot twists<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n    <p>Same taste, different medium — mystery, true crime, and paranormal picks across K-dramas, Indian OTT, and a couple of genre classics. Shuffle when you've cleared the shelf.<\u002Fp>\n    <div class=\"anime-grid\">\n      <sc-for list=\"{{screenPicks}}\" as=\"item\" hint-placeholder-count=\"6\">\n        <div class=\"anime-card\">\n          <span class=\"anime-tag mono\">{{item.tag}}<\u002Fspan>\n          <div class=\"anime-title\">{{item.title}}<\u002Fdiv>\n          <p class=\"anime-hook\">{{item.hook}}<\u002Fp>\n          <a href=\"{{item.link}}\" target=\"_blank\" rel=\"noopener\">Find it →<\u002Fa>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n    <button class=\"btn\" sc-camel-on-click=\"{{onShuffleScreens}}\">Shuffle picks →<\u002Fbutton>\n  <\u002Fsection>\n\n  <section id=\"mystery\" class=\"card\">\n    <div class=\"card-head\">\n      <div>\n        <span class=\"card-kicker mono\"><span class=\"icon-badge icon-blue\">✚<\u002Fspan>Case File<\u002Fspan>\n        <h2 class=\"card-title display\">Open Investigations<\u002Fh2>\n      <\u002Fdiv>\n      <div class=\"rating rating--garnet\"><span class=\"rating-num display\">93<\u002Fspan><span class=\"rating-tag\">curiosity<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n    <p>For the nights you want something unresolved to think about.<\u002Fp>\n    <div class=\"case-grid\">\n      <div>\n        <span class=\"case-col-title mono\">Watch<\u002Fspan>\n        <div class=\"case-item\"><b>Indian Predator<\u002Fb> India-based true crime, told with real case footage.<\u002Fdiv>\n        <div class=\"case-item\"><b>Mindhunter<\u002Fb> The FBI's early profiling unit, one uncomfortable interview at a time.<\u002Fdiv>\n        <div class=\"case-item\"><b>Unsolved Mysteries<\u002Fb> Cold cases, disappearances, and a couple of genuinely unexplained ones.<\u002Fdiv>\n      <\u002Fdiv>\n      <div>\n        <span class=\"case-col-title mono\">Read / Scroll<\u002Fspan>\n        <div class=\"case-item\"><a href=\"https://www.reddit.com/r/UnresolvedMysteries/\" target=\"_blank\" rel=\"noopener\"><b>r/UnresolvedMysteries<\u002Fb><\u002Fa> Deep-dive write-ups on cold cases.<\u002Fdiv>\n        <div class=\"case-item\"><a href=\"https://www.reddit.com/r/RBI/\" target=\"_blank\" rel=\"noopener\"><b>r/RBI<\u002Fb><\u002Fa> Reddit Bureau of Investigation — crowdsourced sleuthing.<\u002Fdiv>\n        <div class=\"case-item\"><a href=\"https://www.reddit.com/r/Paranormal/\" target=\"_blank\" rel=\"noopener\"><b>r/Paranormal<\u002Fb><\u002Fa> First-hand accounts, no gatekeeping on how weird.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"roast\" class=\"card\">\n    <div class=\"card-head\">\n      <div>\n        <span class=\"card-kicker mono\"><span class=\"icon-badge icon-garnet\">▲<\u002Fspan>Strictly Banter<\u002Fspan>\n        <h2 class=\"card-title display\">Dhoni-Fan Roast Machine<\u002Fh2>\n      <\u002Fdiv>\n      <div class=\"rating rating--blue\"><span class=\"rating-num display\">100<\u002Fspan><span class=\"rating-tag\">savagery<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n    <p>Your favorite hobby after football and lifting. Press for ammunition — the pool's big enough that you won't run dry for a while.<\u002Fp>\n    <div class=\"generator\">\n      <div class=\"generator-out\" key=\"{{roastKey}}\">{{roastLine}}<\u002Fdiv>\n      <div class=\"copy-row\">\n        <button class=\"btn\" sc-camel-on-click=\"{{onNextRoast}}\">Load next roast →<\u002Fbutton>\n        <button class=\"btn copy-btn\" sc-camel-on-click=\"{{onCopyRoast}}\">Copy roast<\u002Fbutton>\n        <sc-if value=\"{{roastCopied}}\" hint-placeholder-val=\"{{false}}\"><span class=\"copy-feedback\">Copied<\u002Fspan><\u002Fsc-if>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <p style=\"margin-top:16px; font-size:.85rem; color:var(--muted);\">Twitter and Instagram don't let outside sites pull their posts directly, so these lines are written fresh — grounded in the real moments (2011, the 2019 run-out, the 7:29pm retirement post, 2023). For the actual live stuff people are posting today, these three never run dry:<\u002Fp>\n    <ul class=\"linklist\">\n      <li><a href=\"https://www.reddit.com/r/Cricket/search/?q=dhoni%20fans&amp;restrict_sr=1&amp;sort=new\" target=\"_blank\" rel=\"noopener\">r/Cricket — live \"Dhoni fans\" search <span class=\"arrow\">→<\u002Fspan><\u002Fa><\u002Fli>\n      <li><a href=\"https://twitter.com/search?q=dhoni%20fans&amp;f=live\" target=\"_blank\" rel=\"noopener\">X / Twitter — live search <span class=\"arrow\">→<\u002Fspan><\u002Fa><\u002Fli>\n      <li><a href=\"https://www.instagram.com/popular/dhoni-memes-funny/\" target=\"_blank\" rel=\"noopener\">Instagram — Dhoni memes feed <span class=\"arrow\">→<\u002Fspan><\u002Fa><\u002Fli>\n    <\u002Ful>\n  <\u002Fsection>\n\n  <section id=\"food\" class=\"card\">\n    <div class=\"card-head\">\n      <div>\n        <span class=\"card-kicker mono\"><span class=\"icon-badge icon-blue\">◆<\u002Fspan>Fuel For The Split<\u002Fspan>\n        <h2 class=\"card-title display\">High-Protein, Strictly Veg<\u002Fh2>\n      <\u002Fdiv>\n      <div class=\"rating rating--garnet\"><span class=\"rating-num display\">97<\u002Fspan><span class=\"rating-tag\">protein<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n    <p>Vegetarian and still built around the gym schedule — six recipes that lean on paneer, dals, and legumes to do the protein work no meat is doing here.<\u002Fp>\n    <div class=\"food-grid\">\n      <sc-for list=\"{{foodPicks}}\" as=\"item\" hint-placeholder-count=\"6\">\n        <div class=\"food-item\"><div class=\"food-name\">{{item.name}}<\u002Fdiv><div class=\"food-desc\">{{item.desc}}<\u002Fdiv><\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n    <button class=\"btn\" sc-camel-on-click=\"{{onShuffleFood}}\">Refresh recipes →<\u002Fbutton>\n\n    <p style=\"margin:26px 0 4px; font-weight:700;\">Rough timing, if you want to plan around lifts<\u002Fp>\n    <div class=\"case-grid\">\n      <div>\n        <span class=\"case-col-title mono\">Pre-Workout<\u002Fspan>\n        <div class=\"case-item\"><b>Moong Dal Chilla<\u002Fb> Carbs plus protein, light enough not to sit heavy through a lift.<\u002Fdiv>\n        <div class=\"case-item\"><b>Hung Curd &amp; Sprouts Bowl<\u002Fb> Quick, no-cook, easy on the stomach before training.<\u002Fdiv>\n      <\u002Fdiv>\n      <div>\n        <span class=\"case-col-title mono\">Post-Workout<\u002Fspan>\n        <div class=\"case-item\"><b>Paneer Bhurji<\u002Fb> Fast to make, dense enough to cover the post-lift protein window.<\u002Fdiv>\n        <div class=\"case-item\"><b>Soya Chunk Curry<\u002Fb> The highest-protein option here — best saved for after, not before, a session.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"tictactoe\" class=\"card\">\n    <div class=\"card-head\">\n      <div>\n        <span class=\"card-kicker mono\"><span class=\"icon-badge icon-garnet\">■<\u002Fspan>Game Corner<\u002Fspan>\n        <h2 class=\"card-title display\">Brownie vs. Momo<\u002Fh2>\n      <\u002Fdiv>\n      <div class=\"rating rating--blue\"><span class=\"rating-num display\">1v1<\u002Fspan><span class=\"rating-tag\">you vs mishtu<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n    <p>You're Brownie. Mishtu plays Momo. Pick a game.<\u002Fp>\n    <div class=\"game-tabs\">\n      <sc-for list=\"{{gameTabs}}\" as=\"tab\" hint-placeholder-count=\"4\">\n        <button class=\"mood-btn game-tab {{tab.cls}}\" sc-camel-on-click=\"{{tab.onClick}}\">{{tab.label}}<\u002Fbutton>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n    <div class=\"ttt-legend\">\n      <span><img src=\"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAKAAAACgCAYAAACLz2ctAAAWfmNhQlgAABZ+anVtYgAAAB5qdW1kYzJwYQARABCAAACqADibcQNjMnBhAAAAFlhqdW1iAAAAR2p1bWRjMm1hABEAEIAAAKoAOJtxA3VybjpjMnBhOjZhNTNjOGY5LTQ1ZTgtNDdjMi1iMzI0LTNkNDBmODU3MzAzZQAAAAOTanVtYgAAAClqdW1kYzJhcwARABCAAACqADibcQNjMnBhLmFzc2VydGlvbnMAAAAAuGp1bWIAAABEanVtZGNib3IAEQAQgAAAqgA4m3ETYzJwYS5pbmdyZWRpZW50LnYzAAAAABhjMnNowCxmfgIXY0VSfFEcKC2y5gAAAGxjYm9yo2lkYzpmb3JtYXRpaW1hZ2UvcG5namluc3RhbmNlSUR4LHhtcDppaWQ6NWQ3YzBhZDAtZDEwNi00ZDczLWFlMTYtY2VmMjdlNjNiOWJibHJlbGF0aW9uc2hpcGhwYXJlbnRPZgAAAeJqdW1iAAAAQWp1bWRjYm9yABEAEIAAAKoAOJtxE2MycGEuYWN0aW9ucy52MgAAAAAYYzJzaOEPybqgcdT5Iy4ijoYl9rkAAAGZY2JvcqJnYWN0aW9uc4KiZmFjdGlvbmtjMnBhLm9wZW5lZGpwYXJhbWV0ZXJzoWtpbmdyZWRpZW50c4GiY3VybHgtc2VsZiNqdW1iZj1jMnBhLmFzc2VydGlvbnMvYzJwYS5pbmdyZWRpZW50LnYzZGhhc2hYINDw97sa9BiM14VrQGYKaISR42AIx6x315MU/bByq7/xpGZhY3Rpb254HWNvbS5hbnRocm9waWMuY2xhdWRlLnByb3ZpZ
